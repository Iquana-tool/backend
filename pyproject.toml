[project]
name = "coral-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "celery>=5.6.2",
    "celery-types>=0.24.0",
    "fastapi[standard]>=0.68.0",
    "httpx>=0.24.0",
    "instructor>=1.3.0",
    "iquana-toolbox",
    "litellm>=1.40.0",
    "numpy>=1.21.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pgvector>=0.5.0",
    "pillow~=11.1.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.10.6",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.0",
    "redis>=7.1.0",
    "scipy>=1.16.3",
    "sqlalchemy~=2.0.38",
    # Transitively required by iquana-toolbox. Declared directly (in addition
    # to being a transitive dep) purely so the [tool.uv.sources] override
    # below is honored -- uv only applies source overrides to direct deps.
    "torch",
    "uvicorn>=0.15.0",
]

[tool.uv.sources]
iquana-toolbox = { git = "https://github.com/Iquana-tool/iquana-toolbox.git" }
# iquana-toolbox pulls in torch transitively. This backend never runs model
# inference itself (that's the separate ai-service, over AI_SERVICE_URL) and
# no code here imports torch directly, so the CUDA build is pure dead weight:
# it drags in the full CUDA toolkit (~GBs of nvidia-*/triton packages) on
# every `uv sync`. Route torch to the CPU-only wheel instead.
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
