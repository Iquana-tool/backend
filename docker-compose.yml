services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iquana-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-iquana}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iquana}
      - POSTGRES_DB=${POSTGRES_DB:-iquana}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iquana} -d ${POSTGRES_DB:-iquana}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: iquana-mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,mlflow,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1
      --serve-artifacts
      --artifacts-destination /mlflow
      --backend-store-uri sqlite:////mlflow/mlflow.db

  iquana-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: iquana-backend:latest
    container_name: iquana-backend
    ports:
      - "8000:8000"
    volumes:
      # Mounted at the same absolute path it has on the host (not /data) so that
      # file_path/thumbnail_file_path/folder_path values stored in the DB are
      # readable both from inside this container AND from the ai-service, which
      # runs natively on the host (not in Docker, to keep Apple Silicon MPS
      # acceleration) and has no way to resolve a container-only /data path.
      - ./data:/Users/prpr02-admin/Documents/DFKI/Project_Coral/iquana-tool/backend/data
      - ./logs:/app/logs
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:7000}
      # Unified ai-service; the backend derives each task URL as "<AI_SERVICE_URL>/<task>".
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://host.docker.internal:8004}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-iquana}:${POSTGRES_PASSWORD:-iquana}@postgres:5432/${POSTGRES_DB:-iquana}}
      - MLFLOW_URL=${MLFLOW_URL:-http://mlflow:5000}
      - DATA_DIR=/Users/prpr02-admin/Documents/DFKI/Project_Coral/iquana-tool/backend/data
      # User telemetry / study logging; see app/services/telemetry/README.md.
      # USER_EVENTS_ENABLED is read at boot, so changing it needs a container
      # restart; the rest are boot defaults, changeable live via the API.
      - USER_EVENTS_ENABLED=${USER_EVENTS_ENABLED:-false}
      - USER_EVENTS_CAPTURE=${USER_EVENTS_CAPTURE:-false}
      - USER_EVENTS_COMPONENTS=${USER_EVENTS_COMPONENTS:-annotation,ai,navigation,api}
      - USER_EVENTS_FLUSH_INTERVAL_MS=${USER_EVENTS_FLUSH_INTERVAL_MS:-5000}
      - USER_EVENTS_BATCH_SIZE=${USER_EVENTS_BATCH_SIZE:-50}
      - USER_EVENTS_MAX_PAYLOAD_BYTES=${USER_EVENTS_MAX_PAYLOAD_BYTES:-4096}
      - USER_EVENTS_MAX_BATCH=${USER_EVENTS_MAX_BATCH:-200}
      - USER_EVENTS_QUEUE_SIZE=${USER_EVENTS_QUEUE_SIZE:-10000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres-data:
  mlflow-data: