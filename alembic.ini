# Alembic configuration for the iquana backend. Run commands from backend/, e.g.
#
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "add teams"
#   .venv/Scripts/python.exe -m alembic upgrade head
#
# There is no sqlalchemy.url here on purpose: migrations/env.py takes DATABASE_URL
# from config.py, exactly as the app does, so the CLI and the app cannot disagree
# about which database they are migrating.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Date-first names keep migrations/versions/ listed in the order they were written.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic,migrations

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# What the revisions themselves report, e.g. what the baseline added while adopting.
[logger_migrations]
level = INFO
handlers =
qualname = migrations

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
